[tool.marimo.language_servers.pylsp]
enabled = true

[tool.marimo.language_servers.ty]
enabled = true

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.environment]
python-version = "3.13"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
